services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    image: httpd
    ports:
      - 8000:80
    volumes:
      - ./html:/usr/local/apache2/htdocs

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: neeger
    volumes:
      - ta24alearndbdata:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  ta24alearndbdata:
